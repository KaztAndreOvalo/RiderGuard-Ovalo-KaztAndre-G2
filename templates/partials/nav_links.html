{% if user.is_authenticated %}
  {% if user.is_admin_role %}
    <a href="{% url 'adminpanel:dashboard' %}">Dashboard</a>
    <a href="{% url 'adminpanel:users' %}">Users</a>
    <a href="{% url 'adminpanel:trips' %}">Trips</a>
    <a href="{% url 'adminpanel:rates' %}">Rates</a>
  {% else %}
    <a href="{% url 'dashboard:rider' %}">Dashboard</a>
    <a href="{% url 'trips:list' %}">My trips</a>
  {% endif %}
  <a href="{% url 'accounts:profile' %}"><img class="avatar-sm" src="{{ user.photo_url }}" alt=""> Profile</a>
  <span class="role-badge">{{ user.get_role_display }}</span>
  <form method="post" action="{% url 'accounts:logout' %}">
    {% csrf_token %}
    <button type="submit">Log out</button>
  </form>
{% else %}
  <a href="{% url 'home' %}">Home</a>
  <a href="{% url 'accounts:login' %}">Log in</a>
  <a href="{% url 'accounts:register' %}">Register</a>
{% endif %}
